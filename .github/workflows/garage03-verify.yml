name: Verify Relais 24

on:
  push:
    branches:
      - 'feat/garage-03-relais-24'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke Relais 24 routes
        shell: bash
        env:
          GARAGE03_REQUIRE_AVAILABLE: "1"
        run: |
          npm run start -- -p 3000 > /tmp/garage03-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/garage03-next.log
            exit 1
          fi

          node scripts/smoke-garage03.mjs
