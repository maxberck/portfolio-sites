name: Portfolio visual QA

on:
  push:
    branches:
      - feat/portfolio-home-templates-contact
    paths:
      - '.github/workflows/visual-qa.yml'
      - 'app/(portfolio)/**'
      - 'src/portfolio/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx --yes playwright@latest install --with-deps chromium

      - name: Capture portfolio viewports
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/portfolio-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/portfolio-next.log
            exit 1
          fi

          mkdir -p /tmp/portfolio-qa
          npx --yes playwright@latest screenshot --browser=chromium --viewport-size="1440,1000" --wait-for-timeout=1500 --full-page http://127.0.0.1:3000/ /tmp/portfolio-qa/home-desktop-1440-full.png
          npx --yes playwright@latest screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=1500 --full-page http://127.0.0.1:3000/ /tmp/portfolio-qa/home-mobile-390-full.png
          npx --yes playwright@latest screenshot --browser=chromium --viewport-size="1440,1000" --wait-for-timeout=1500 --full-page http://127.0.0.1:3000/templates /tmp/portfolio-qa/templates-desktop-1440-full.png
          npx --yes playwright@latest screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=1500 --full-page http://127.0.0.1:3000/templates /tmp/portfolio-qa/templates-mobile-390-full.png
          npx --yes playwright@latest screenshot --browser=chromium --viewport-size="1440,1000" --wait-for-timeout=1500 --full-page http://127.0.0.1:3000/contact /tmp/portfolio-qa/contact-desktop-1440-full.png
          npx --yes playwright@latest screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=1500 --full-page http://127.0.0.1:3000/contact /tmp/portfolio-qa/contact-mobile-390-full.png

      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-home-templates-contact-qa
          path: /tmp/portfolio-qa/*.png
          if-no-files-found: error
          retention-days: 7
