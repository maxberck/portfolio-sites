name: Maison Silex visual QA

on:
  push:
    branches:
      - feat/restaurant-01-silex-redesign
    paths:
      - '.github/workflows/silex-visual-qa.yml'
      - 'app/sites/restaurant-01/**'
      - 'src/templates/restaurant-01/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx --yes playwright@latest install --with-deps chromium

      - name: Capture Maison Silex viewports
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/silex-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/sites/restaurant-01 > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/silex-next.log
            exit 1
          fi

          mkdir -p /tmp/silex-qa
          npx --yes playwright@latest screenshot --browser=chromium --viewport-size="1440,1000" --wait-for-timeout=2500 http://127.0.0.1:3000/sites/restaurant-01 /tmp/silex-qa/desktop-1440.png
          npx --yes playwright@latest screenshot --browser=chromium --viewport-size="768,1024" --wait-for-timeout=2500 http://127.0.0.1:3000/sites/restaurant-01 /tmp/silex-qa/tablet-768.png
          npx --yes playwright@latest screenshot --browser=chromium --viewport-size="375,812" --wait-for-timeout=2500 http://127.0.0.1:3000/sites/restaurant-01 /tmp/silex-qa/mobile-375.png

      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: silex-visual-qa
          path: /tmp/silex-qa/*.png
          if-no-files-found: error
          retention-days: 7
