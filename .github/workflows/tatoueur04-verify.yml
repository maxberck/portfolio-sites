name: Verify Matière

on:
  push:
    branches:
      - 'feat/tatoueur-04-matiere'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Smoke Matière routes
        shell: bash
        env:
          TATOUEUR04_REQUIRE_AVAILABLE: "0"
        run: |
          npm run start -- -p 3000 > /tmp/tatoueur04-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-tatoueur04.mjs
      - name: Install browser regression tooling
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Check Matière browser layout and images
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/tatoueur04-ui-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/sites/tatoueur-04 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-tatoueur04-ui.mjs
      - name: Verify Matière publication
        shell: bash
        env:
          TATOUEUR04_REQUIRE_AVAILABLE: "1"
        run: |
          npm run start -- -p 3000 > /tmp/tatoueur04-publish-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/sites/tatoueur-04 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-tatoueur04.mjs
