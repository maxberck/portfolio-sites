name: Verify District 88

on:
  push:
    branches:
      - 'feat/restaurant-02-district-88-build'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke District 88 routes
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/d88-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/d88-next.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:3000/sites/restaurant-02 > /tmp/d88-home.html
          curl -fsS http://127.0.0.1:3000/sites/restaurant-02/menu > /tmp/d88-menu.html
          curl -fsS http://127.0.0.1:3000/sites/restaurant-02/concept > /tmp/d88-concept.html
          curl -fsS http://127.0.0.1:3000/sites/restaurant-02/galerie > /tmp/d88-gallery.html
          curl -fsS http://127.0.0.1:3000/sites/restaurant-02/contact > /tmp/d88-contact.html
          curl -fsS http://127.0.0.1:3000/categories/restaurant > /tmp/d88-restaurant-category.html

          for page in /tmp/d88-home.html /tmp/d88-menu.html /tmp/d88-concept.html /tmp/d88-gallery.html /tmp/d88-contact.html; do
            grep -q 'name="robots" content="noindex, follow"' "$page"
            ! grep -qi '<iframe' "$page"
          done

          grep -q 'EAT LOUD.' /tmp/d88-home.html
          grep -q 'HOT. FAST. MESSY. GOOD.' /tmp/d88-home.html
          grep -q 'MENU / 88' /tmp/d88-menu.html
          grep -q 'SMASH' /tmp/d88-menu.html
          grep -q 'NO QUIET FOOD.' /tmp/d88-concept.html
          grep -q 'THE 88 RULE' /tmp/d88-concept.html
          grep -q 'CONTACT SHEET' /tmp/d88-gallery.html
          grep -q 'FIND US.' /tmp/d88-contact.html
          grep -q 'Adresse de démonstration' /tmp/d88-contact.html

          grep -q 'href="/sites/restaurant-02/menu"' /tmp/d88-home.html
          grep -q 'href="/sites/restaurant-02/concept"' /tmp/d88-home.html
          grep -q 'href="/sites/restaurant-02/galerie"' /tmp/d88-home.html
          grep -q 'href="/sites/restaurant-02/contact"' /tmp/d88-home.html

          restaurant_available_count=$(grep -oE '<article[^>]*site-card--available[^>]*>' /tmp/d88-restaurant-category.html | wc -l | tr -d ' ')
          echo "Available restaurant demos: $restaurant_available_count"
          test "$restaurant_available_count" -eq 4
          grep -q 'data-site-card="restaurant-02"' /tmp/d88-restaurant-category.html
          grep -q 'restaurant-02-home.webp' /tmp/d88-restaurant-category.html
          grep -q 'href="/sites/restaurant-02"' /tmp/d88-restaurant-category.html
          test -s public/previews/restaurant-02-home.webp
