name: Maison Silex layout debug

on:
  push:
    branches:
      - feat/restaurant-01-silex-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx --yes playwright@latest install --with-deps chromium

      - name: Capture Silex full pages
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/silex-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/sites/restaurant-01 > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/silex-next.log
            exit 1
          fi

          mkdir -p /tmp/silex-layout-debug
          npx --yes playwright@latest screenshot --browser=chromium --viewport-size="1440,1000" --wait-for-timeout=1500 --full-page http://127.0.0.1:3000/sites/restaurant-01 /tmp/silex-layout-debug/home-desktop-full.png
          npx --yes playwright@latest screenshot --browser=chromium --viewport-size="375,812" --wait-for-timeout=1500 --full-page http://127.0.0.1:3000/sites/restaurant-01 /tmp/silex-layout-debug/home-mobile-full.png
          npx --yes playwright@latest screenshot --browser=chromium --viewport-size="1440,1000" --wait-for-timeout=1500 --full-page http://127.0.0.1:3000/sites/restaurant-01/galerie /tmp/silex-layout-debug/gallery-desktop-full.png
          npx --yes playwright@latest screenshot --browser=chromium --viewport-size="375,812" --wait-for-timeout=1500 --full-page http://127.0.0.1:3000/sites/restaurant-01/galerie /tmp/silex-layout-debug/gallery-mobile-full.png

      - name: Upload layout debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: silex-layout-debug
          path: /tmp/silex-layout-debug/*.png
          if-no-files-found: error
          retention-days: 7
