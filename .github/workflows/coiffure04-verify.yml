name: Verify Chromatic

on:
  push:
    branches:
      - 'feat/coiffure-04-chromatic'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Smoke Chromatic routes
        shell: bash
        env:
          COIFFURE04_REQUIRE_AVAILABLE: "1"
        run: |
          npm run start -- -p 3000 > /tmp/coiffure04-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-coiffure04.mjs
