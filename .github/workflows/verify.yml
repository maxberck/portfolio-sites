name: Verify portfolio

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke portfolio routes and compatibility
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/portfolio-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/portfolio-next.log
            exit 1
          fi

          node scripts/smoke-portfolio-ia.mjs

          curl -fsS http://127.0.0.1:3000/categories/garage > /tmp/garage.html
          curl -fsS http://127.0.0.1:3000/categories/restaurant > /tmp/restaurant.html
          curl -fsS http://127.0.0.1:3000/categories/coiffure > /tmp/coiffure.html
          curl -fsS http://127.0.0.1:3000/categories/tatoueur > /tmp/tatoueur.html
          curl -fsS http://127.0.0.1:3000/robots.txt > /tmp/robots.txt
          curl -fsS http://127.0.0.1:3000/sitemap.xml > /tmp/sitemap.xml

          count_cards() {
            grep -o 'data-site-card="[^"]*"' "$1" | sort -u | wc -l | tr -d ' '
          }

          test "$(count_cards /tmp/garage.html)" -eq 4
          test "$(count_cards /tmp/restaurant.html)" -eq 4
          test "$(count_cards /tmp/coiffure.html)" -eq 4
          test "$(count_cards /tmp/tatoueur.html)" -eq 4

          grep -q 'data-portfolio-design="technical-minimalist"' <(curl -fsS http://127.0.0.1:3000/)
          test -s /tmp/robots.txt
          test -s /tmp/sitemap.xml

          curl -fsS http://127.0.0.1:3000/sites/restaurant-04 > /tmp/kuro-home.html
          curl -fsS http://127.0.0.1:3000/sites/restaurant-01 > /tmp/silex-home.html
          grep -q 'name="robots" content="noindex, follow"' /tmp/kuro-home.html
          grep -q 'name="robots" content="noindex, follow"' /tmp/silex-home.html
          grep -q 'Précision. Saison. Silence.' /tmp/kuro-home.html
          grep -q 'Une cuisine de saison, précise et sensible.' /tmp/silex-home.html

          test -s public/previews/restaurant-04-home.webp
          test -s public/previews/garage-01-home.webp
          test -s public/previews/coiffure-01-home.webp
          test -s public/previews/tatoueur-01-home.webp
