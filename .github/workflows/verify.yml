name: Verify portfolio

on:
  push:
    branches:
      - feat/portfolio-architecture
      - feat/restaurant-04-japanese-minimal
      - feat/restaurant-01-maison-silex
      - feat/portfolio-commercial-redesign
      - feat/restaurant-01-silex-redesign
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke test routes and catalogue counts
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/portfolio-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /tmp/home.html; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/portfolio-next.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:3000/categories/garage > /tmp/garage.html
          curl -fsS http://127.0.0.1:3000/categories/restaurant > /tmp/restaurant.html
          curl -fsS http://127.0.0.1:3000/categories/coiffure > /tmp/coiffure.html
          curl -fsS http://127.0.0.1:3000/categories/tatoueur > /tmp/tatoueur.html
          curl -fsS http://127.0.0.1:3000/robots.txt > /tmp/robots.txt
          curl -fsS http://127.0.0.1:3000/sitemap.xml > /tmp/sitemap.xml

          count_cards() {
            grep -o 'data-site-card="[^"]*"' "$1" | sort -u | wc -l | tr -d ' '
          }

          home_count=$(count_cards /tmp/home.html)
          garage_count=$(count_cards /tmp/garage.html)
          restaurant_count=$(count_cards /tmp/restaurant.html)
          coiffure_count=$(count_cards /tmp/coiffure.html)
          tatoueur_count=$(count_cards /tmp/tatoueur.html)

          echo "Homepage cards: $home_count"
          echo "Garage cards: $garage_count"
          echo "Restaurant cards: $restaurant_count"
          echo "Coiffure cards: $coiffure_count"
          echo "Tatoueur cards: $tatoueur_count"

          test "$home_count" -eq 16
          test "$garage_count" -eq 4
          test "$restaurant_count" -eq 4
          test "$coiffure_count" -eq 4
          test "$tatoueur_count" -eq 4

          grep -q 'Des sites qui ressemblent à de vraies marques.' /tmp/home.html
          grep -q 'Créer mon site' /tmp/home.html
          grep -q 'href="/categories/garage"' /tmp/home.html
          grep -q 'href="/categories/restaurant"' /tmp/home.html
          grep -q 'href="/categories/coiffure"' /tmp/home.html
          grep -q 'href="/categories/tatoueur"' /tmp/home.html
          grep -q 'data-preview="real"' /tmp/home.html
          grep -q 'restaurant-04-home.webp' /tmp/home.html
          grep -q 'restaurant-01-home.webp' /tmp/home.html
          ! grep -qi '<iframe' /tmp/home.html

          test -s public/previews/restaurant-04-home.webp
          test -s public/previews/restaurant-01-home.webp
          test -s /tmp/robots.txt
          test -s /tmp/sitemap.xml

          curl -fsS http://127.0.0.1:3000/sites/restaurant-04 > /tmp/kuro-home.html
          curl -fsS http://127.0.0.1:3000/sites/restaurant-04/menu > /tmp/kuro-menu.html
          curl -fsS http://127.0.0.1:3000/sites/restaurant-04/restaurant > /tmp/kuro-restaurant.html
          curl -fsS http://127.0.0.1:3000/sites/restaurant-04/galerie > /tmp/kuro-gallery.html
          curl -fsS http://127.0.0.1:3000/sites/restaurant-04/contact > /tmp/kuro-contact.html

          for page in /tmp/kuro-home.html /tmp/kuro-menu.html /tmp/kuro-restaurant.html /tmp/kuro-gallery.html /tmp/kuro-contact.html; do
            grep -q 'name="robots" content="noindex, follow"' "$page"
          done

          grep -q 'Précision. Saison. Silence.' /tmp/kuro-home.html
          grep -q 'Omakase' /tmp/kuro-menu.html
          grep -q 'La table' /tmp/kuro-restaurant.html
          grep -q 'Galerie' /tmp/kuro-gallery.html
          grep -q 'Adresse de démonstration' /tmp/kuro-contact.html
          grep -q 'href="/sites/restaurant-04"' /tmp/restaurant.html

          curl -fsS http://127.0.0.1:3000/sites/restaurant-01 > /tmp/silex-home.html
          curl -fsS http://127.0.0.1:3000/sites/restaurant-01/menu > /tmp/silex-menu.html
          curl -fsS http://127.0.0.1:3000/sites/restaurant-01/maison > /tmp/silex-maison.html
          curl -fsS http://127.0.0.1:3000/sites/restaurant-01/galerie > /tmp/silex-gallery.html
          curl -fsS http://127.0.0.1:3000/sites/restaurant-01/contact > /tmp/silex-contact.html

          for page in /tmp/silex-home.html /tmp/silex-menu.html /tmp/silex-maison.html /tmp/silex-gallery.html /tmp/silex-contact.html; do
            grep -q 'name="robots" content="noindex, follow"' "$page"
          done

          grep -q 'Une cuisine de saison, précise et sensible.' /tmp/silex-home.html
          grep -q 'Menu dégustation' /tmp/silex-menu.html
          grep -q 'La Maison' /tmp/silex-maison.html
          grep -q 'Galerie' /tmp/silex-gallery.html
          grep -q 'Adresse de démonstration' /tmp/silex-contact.html
          grep -q 'href="/sites/restaurant-01"' /tmp/restaurant.html

          grep -q 'data-silex-hero="full-bleed"' /tmp/silex-home.html
          grep -q 'data-silex-chapter="manifesto"' /tmp/silex-home.html
          grep -q 'data-silex-chapter="menu-folio"' /tmp/silex-home.html
          grep -q 'data-silex-page="menu-poster"' /tmp/silex-menu.html
          grep -q 'data-silex-page="maison-story"' /tmp/silex-maison.html
          grep -q 'data-silex-page="gallery-sequence"' /tmp/silex-gallery.html
          grep -q 'data-silex-page="contact-poster"' /tmp/silex-contact.html

          available_count=$(grep -oE '<article[^>]*site-card--available[^>]*>' /tmp/home.html | wc -l | tr -d ' ')
          real_preview_count=$(grep -oE '<div[^>]*data-preview="real"[^>]*>' /tmp/home.html | wc -l | tr -d ' ')
          echo "Available demos: $available_count"
          echo "Real previews: $real_preview_count"
          test "$available_count" -eq 2
          test "$real_preview_count" -eq 2
